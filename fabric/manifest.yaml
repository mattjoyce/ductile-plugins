manifest_spec: ductile.plugin
manifest_version: 1
name: fabric
version: 0.3.0
protocol: 2
entrypoint: run.py
concurrency_safe: false
description: "Wrapper for the fabric AI pattern CLI (github.com/danielmiessler/fabric). Routes inbound text / URLs / YouTube links through a chosen pattern (or freeform prompt) and emits the result as fabric.completed. Stateful — maintains a running executions_count and last_run/last_pattern/last_prompt snapshot via fact_outputs. Serial-only: every invocation shells out to fabric with a timeout (FABRIC_TIMEOUT_SECONDS, default 120s); concurrent runs would contend for the fabric process and any pattern-specific model state."
commands:
  - name: poll
    type: write
    description: "Diagnostic no-op. fabric is event-driven; the poll command exists only so the gateway can periodically exercise the plugin without producing side effects. Does not invoke fabric."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        result:
          type: string
          description: "Always 'Fabric poll command - no scheduled actions configured'."
        logs:
          type: array
          items:
            type: object
      required: [status, logs]
      additionalProperties: false
    values:
      consume: []
      emit: []
  - name: handle
    type: write
    description: "Run one fabric invocation. Composes input from payload.text or payload.content (optionally with a payload.prompt prefix); falls back to URL fetching via fabric's --scrape_url for payload.url or --youtube for payload.youtube_url. Pattern resolution: payload.pattern wins; else config.FABRIC_DEFAULT_PATTERN (unless in prompt-only mode). 120s subprocess timeout. Emits fabric.completed with the captured output and metadata; propagates downstream pipeline fields (output_dir, output_path, filename, file_path, folder) into the event payload. Opt-in: payload.input_file reads the input from a file; output_format json requires one JSON value (a code fence is stripped) and emits it as payload.data; payload.output_file also writes the output there atomically."
    idempotent: false
    retry_safe: true
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: "Raw text to run through the pattern. Mutually populates with content."
        content:
          type: string
          description: "Alias for text."
        url:
          type: string
          description: "URL for fabric --scrape_url. Mutually exclusive with youtube_url."
        youtube_url:
          type: string
          description: "YouTube URL for fabric --youtube."
        pattern:
          type: string
          description: "Named fabric pattern to apply. Falls back to config.FABRIC_DEFAULT_PATTERN."
        prompt:
          type: string
          description: "Freeform prompt. Prepended to text input, or used alone in prompt-only mode."
        model:
          type: string
          description: "Model override (e.g. 'claude-sonnet-4-6'). Falls back to config.FABRIC_DEFAULT_MODEL."
        output_dir:
          type: string
          description: "Pipeline-context field, forwarded into the fabric.completed event payload."
        output_path:
          type: string
          description: "Pipeline-context field, forwarded into the fabric.completed event payload."
        filename:
          type: string
          description: "Pipeline-context field, forwarded into the fabric.completed event payload."
        file_path:
          type: string
          description: "Pipeline-context field, forwarded into the fabric.completed event payload."
        folder:
          type: string
          description: "Pipeline-context field, forwarded into the fabric.completed event payload."
        input_file:
          type: string
          description: "Path, under config.FABRIC_FILE_ROOT, of a regular UTF-8 text file to use as the input when text is absent. Refused without that root, outside it, or over FABRIC_MAX_INPUT_BYTES."
        output_file:
          type: string
          description: "Path, under config.FABRIC_FILE_ROOT, to also write the output to, atomically. Refused without that root or outside it."
        output_format:
          type: string
          enum: [text, json]
          description: "json: the output must be one JSON value, a surrounding code fence removed; emitted as payload.data. Falls back to config.FABRIC_OUTPUT_FORMAT, then text."
      additionalProperties: true
    output_schema:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        result:
          type: string
          description: "Present on ok — short log message describing the run (pattern/url/youtube + prompt summary)."
        error:
          type: string
          description: "Present on error — missing input, fabric binary not found, fabric exit non-zero, or timeout."
        retry:
          type: boolean
          description: "Present on error — true for transient (timeout, fabric non-zero exit); false for structural (binary missing, missing input)."
        events:
          type: array
          description: "Present on ok — single fabric.completed event."
          items:
            type: object
        state_updates:
          type: object
          description: "Present on ok — { last_run, executions_count, last_pattern, last_prompt }. Snapshotted as fabric.snapshot via fact_outputs; executions_count is the rolling tally and is read back on the next invocation."
          properties:
            last_run:
              type: string
              description: "ISO timestamp of this run."
            executions_count:
              type: integer
              minimum: 0
            last_pattern:
              type: string
            last_prompt:
              type: string
        logs:
          type: array
          items:
            type: object
      required: [status, logs]
      additionalProperties: false
    values:
      consume:
        - payload.text
        - payload.content
        - payload.url
        - payload.youtube_url
        - payload.pattern
        - payload.prompt
        - payload.model
        - payload.output_dir
        - payload.output_path
        - payload.filename
        - payload.file_path
        - payload.folder
        - payload.input_file
        - payload.output_file
        - payload.output_format
      emit:
        - event: fabric.completed
          values:
            - payload.result
            - payload.pattern
            - payload.prompt
            - payload.model
            - payload.url
            - payload.youtube_url
            - payload.input_length
            - payload.output_length
            - payload.output_dir
            - payload.output_path
            - payload.filename
            - payload.file_path
            - payload.folder
            - payload.data
            - payload.input_file
            - payload.output_file
  - name: health
    type: read
    description: "Verify the fabric binary is callable and report the count of available patterns (via `fabric --listpatterns`). Does not invoke an actual pattern."
    idempotent: true
    retry_safe: true
    input_schema: {}
    output_schema:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        result:
          type: string
          description: "Present on ok — 'Fabric healthy, <n> patterns available'."
        error:
          type: string
          description: "Present on error — fabric binary not found, --help failed, or timeout."
        retry:
          type: boolean
        logs:
          type: array
          items:
            type: object
      required: [status, logs]
      additionalProperties: false
fact_outputs:
  - when:
      command: handle
    from: state_updates
    fact_type: fabric.snapshot
    compatibility_view: mirror_object
config_keys:
  required: []
  optional:
    - FABRIC_BIN_PATH
    - FABRIC_DEFAULT_MODEL
    - FABRIC_DEFAULT_PATTERN
    - FABRIC_DEFAULT_PROMPT
    - FABRIC_ENV
    - FABRIC_HOME
    - FABRIC_RAW
    - FABRIC_TIMEOUT_SECONDS
    - FABRIC_MAX_INPUT_BYTES
    - FABRIC_OUTPUT_FORMAT
    - FABRIC_FILE_ROOT
