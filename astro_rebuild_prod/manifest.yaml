# astro_rebuild_prod — sibling clone of astro_rebuild_staging.
# Same generic sys_exec runtime (run.py is byte-identical to the source).
# This manifest declares the PROD-specific event contract; the actual
# command run is configured in plugins.yaml at the deploy site, never in
# the webhook payload.  See README.md → "Security model".
manifest_spec: ductile.plugin
manifest_version: 1
name: astro_rebuild_prod
version: 0.1.0
protocol: 2
entrypoint: run.py
description: "Rebuild and restart the production Astro site (mattjoyce.ai) via Docker Compose. Triggered by an HMAC-signed webhook."
commands:
  - name: handle
    type: write
    description: "Run the operator-configured docker compose rebuild and emit a completion event. Payload is trigger-only — never spliced into the command."
    idempotent: false
    retry_safe: true
    values:
      consume:
        - payload.*
      emit:
        - event: mattjoyce.publish.completed
          values:
            - payload.command
            - payload.exit_code
            - payload.duration_ms
            - payload.stdout
            - payload.stderr
            - payload.stdout_truncated
            - payload.stderr_truncated
            - payload.working_dir
            - payload.executed_at
  - name: health
    type: read
    description: "Validate command and runtime prerequisites."
    idempotent: true
    retry_safe: true
config_keys:
  required: [command]
  optional:
    - event_type
    - timeout_seconds
    - working_dir
    - env
    - retry_on_exit_codes
    - emit_event
    - include_output_in_event
    - stdout_max_bytes
    - stderr_max_bytes
