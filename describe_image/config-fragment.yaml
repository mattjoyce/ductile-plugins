# Merge into /etc/ductile/plugins.yaml and /etc/ductile/pipelines.yaml.
# Both plugins run in the trusted tier: folder_watch must read /home/matt/Downloads
# and describe_image must write sidecars there; a confined uid can do neither.

plugins:
  folder_watch:
    enabled: true
    run_as: trusted
    parallelism: 1            # stateful poller; never run two polls concurrently
    timeouts:
      poll: 60s
    schedules:
      # The scheduler ticks every 60s and computes next_run = last_run + interval, so
      # `every: 1m` lands just after each tick and slips to every other tick (2 min).
      # 30s keeps it due on every tick = one poll per minute.
      - every: 30s
        command: poll
    config:
      watches:
        - id: downloads_images
          root: /home/matt/Downloads
          recursive: false
          event_type: downloads.image_changed
          include_globs: ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.webp",
                          "*.JPG", "*.JPEG", "*.PNG", "*.GIF", "*.WEBP"]
          exclude_globs: ["*.md", "*.tmp"]
          emit_mode: per_file
          emit_initial: true    # safe: describe_image skips images whose sidecar sha256 already matches
          min_stable_age: 15s   # LocalSend/browser writes finish in seconds; keeps a fresh photo within ~1 min of describe
          strategy: mtime_size

  describe_image:
    enabled: true
    run_as: trusted
    requires_vault: true
    vault_principal: describe-image
    timeouts:
      handle: 3m
    parallelism: 2
    config:
      model: claude-opus-5
      effort: medium
      sidecar_suffix: ".md"
      delete_orphans: true

pipelines:
  - name: describe-downloads-image
    on: downloads.image_changed
    from_plugin: folder_watch
    steps:
      - uses: describe_image
