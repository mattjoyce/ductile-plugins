manifest_spec: ductile.plugin
manifest_version: 1
name: describe_image
version: 0.2.0
protocol: 2
entrypoint: run.py
concurrency_safe: true
description: "Writes a Markdown sidecar (<image>.md, YAML frontmatter + prose) describing an image, using the Claude Messages API over raw HTTP (stdlib only). Trusted-tier: reads the image from and writes the sidecar into the watched folder in the operator's home. Idempotent on the image's sha256 — an unchanged image with a current sidecar is skipped without an API call. Consumes folder_watch per_file events; on change_type=deleted removes the orphan sidecar when delete_orphans is true."
commands:
  - name: handle
    type: write
    description: "Describe one image. Reads payload.root + payload.path, hashes the file, skips if the sidecar's sha256 matches, otherwise base64-encodes the image, calls the Claude API with the configured model/effort/prompt, and atomically writes <image><sidecar_suffix>. Emits image.described, image.skipped (unchanged / unsupported_type / too_large_after_downscale) or image.orphan_removed."
    idempotent: true
    retry_safe: true
    input_schema:
      payload: object
    values:
      consume:
        - payload.root
        - payload.path
        - payload.change_type
      emit:
        - event: image.described
          values:
            - payload.path
            - payload.sidecar_path
            - payload.sha256
            - payload.model
            - payload.change_type
        - event: image.skipped
          values:
            - payload.path
            - payload.reason
        - event: image.orphan_removed
          values:
            - payload.path
            - payload.sidecar_path
  - name: poll
    type: write
    description: "No-op. Event-driven plugin; poll exists only for liveness exercises."
    idempotent: true
    retry_safe: true
  - name: health
    type: read
    description: "Checks the model config is non-empty and the API key secret was delivered. Does not call the API."
    idempotent: true
    retry_safe: true
config_keys:
  required: []
  optional:
    - model             # default claude-opus-5
    - effort            # low|medium|high|xhigh|max, default medium
    - max_tokens        # default 4096
    - prompt            # description prompt; default is a catalogue-oriented prompt
    - max_image_bytes   # raw-byte cap, default 7000000; larger files are downscaled with Pillow, skipped if that fails
    - max_edge          # long-edge px cap, default 2576 (Opus 5 native); larger images are downscaled
    - jpeg_quality      # quality for downscaled JPEG output, default 90
    - sidecar_suffix    # default ".md" -> PXL_x.jpg.md
    - secret_name       # vault secret key in request.secrets, default anthropic-api-key
    - delete_orphans    # remove sidecar when the image is deleted, default true
    - timeout_seconds   # API call timeout, default 120
secrets:
  - anthropic-api-key
